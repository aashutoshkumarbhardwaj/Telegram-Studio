databases:
  - name: heyaaashu-postgres
    plan: free
    databaseName: heyaaashu_studio
    user: heyaaashu_user
    ipAllowList: []

services:
  - type: web
    name: heyaaashu-studio
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heyaaashu-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: STUDIO_AUTH_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost,http://127.0.0.1
